{% extends "base.html" %}

{% block title %}TapLokal - Log in{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <div class="card card-tl"><div class="card-body p-4">
            <h2 class="mb-3" style="color: var(--tl-navy);">Log in</h2>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "includes/form_fields.html" %}
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>
            <p class="mt-3 mb-0 text-center">No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
        </div></div>
    </div>
</div>
{% endblock %}
