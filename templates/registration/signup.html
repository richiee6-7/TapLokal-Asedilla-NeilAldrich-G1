{% extends "base.html" %}

{% block title %}TapLokal - Sign up{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-tl"><div class="card-body p-4">
            <h2 class="mb-3" style="color: var(--tl-navy);">Create your account</h2>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "includes/form_fields.html" %}
                <button type="submit" class="btn btn-primary w-100">Sign up</button>
            </form>
            <p class="mt-3 mb-0 text-center">Already registered? <a href="{% url 'login' %}">Log in</a></p>
        </div></div>
    </div>
</div>
{% endblock %}
