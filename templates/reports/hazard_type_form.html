{% extends "base.html" %}

{% block title %}TapLokal - {{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-tl"><div class="card-body p-4">
            <h2 class="mb-3" style="color: var(--tl-navy);">{{ page_title }}</h2>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "includes/form_fields.html" %}
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'hazard_types' %}" class="btn btn-link">Cancel</a>
            </form>
        </div></div>
    </div>
</div>
{% endblock %}
