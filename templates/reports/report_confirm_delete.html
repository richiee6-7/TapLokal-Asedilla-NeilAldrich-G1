{% extends "base.html" %}

{% block title %}TapLokal - Delete report{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <div class="card card-tl"><div class="card-body p-4">
            <h2 class="mb-3" style="color: var(--tl-navy);">Delete report #{{ report.pk }}?</h2>
            <p>This will permanently delete your {{ report.hazard_type.name }} report at {{ report.street_address }}.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, delete</button>
                <a href="{% url 'report_detail' report.pk %}" class="btn btn-link">Cancel</a>
            </form>
        </div></div>
    </div>
</div>
{% endblock %}
